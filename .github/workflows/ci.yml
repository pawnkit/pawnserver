name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: CGO_ENABLED=1 go test -race -shuffle=on ./...

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
      - run: |
          go test ./bundle -run=^$ -fuzz=FuzzLoadManifest -fuzztime=5s
          go test ./bundle -run=^$ -fuzz=FuzzExtract -fuzztime=5s

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go tool govulncheck ./...

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.12.7
          args: release --snapshot --clean
      - run: |
          archive=$(find dist -name '*linux_amd64.tar.gz' -print -quit)
          test -n "$archive"
          mkdir -p /tmp/pawnserver-release
          tar -xzf "$archive" -C /tmp/pawnserver-release
          /tmp/pawnserver-release/pawnserver --version

  tested-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: windows-latest
            target: windows-amd64
          - os: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: pawnkit/pawnkit-spec
          ref: v0.1.137
          path: .pawnkit/spec
          persist-credentials: false
      - id: pawnserver
        uses: pawnkit/pawn-actions/release-set@v1.8.73
        with:
          release-set: .pawnkit/spec/release-sets/server-preview-2026-08-03.json
          component: pawnserver
          target: ${{ matrix.target }}
          verify-remote: 'false'
      - uses: pawnkit/pawn-actions/setup-tool@v1.8.73
        with:
          binary: pawnserver
          version: ${{ steps.pawnserver.outputs.version }}
          download-url: ${{ steps.pawnserver.outputs.url }}
          sha256: ${{ steps.pawnserver.outputs.sha256 }}
      - run: pawnserver --version

  support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pawnkit/pawn-actions/support-check@v1.8.73
        with:
          repository: pawnkit/pawnserver
          targets: linux-amd64,windows-amd64,darwin-arm64
